# Tests on every PR and push. On master, package an unsigned .mxt.
# Workflow artifacts expire (~90 days). A git tag is only a pointer; binaries
# live forever on a GitHub Release attached to tag v{module_build}.
# Local `gradlew lunchflow` still signs with the gitignored key.

name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Package unsigned extension
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon copyUnsignedMxt

      - name: Read module_build
        if: github.event_name != 'pull_request'
        id: ver
        run: |
          build=$(sed -n 's/.*"module_build" *= *"\([0-9][0-9]*\)".*/\1/p' \
            src/main/resources/com/moneydance/modules/features/lunchflow/meta_info.dict | head -1)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          cp dist/lunchflow-unsigned.mxt "dist/lunchflow-unsigned-v${build}.mxt"

      - name: Upload workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lunchflow-unsigned-v${{ steps.ver.outputs.build }}
          path: dist/lunchflow-unsigned-v${{ steps.ver.outputs.build }}.mxt
          if-no-files-found: error
          retention-days: 90

      - name: GitHub Release for this module_build
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          tag="v${BUILD}"
          asset="dist/lunchflow-unsigned-v${BUILD}.mxt"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi
          notes=$(mktemp)
          awk -v ver="$BUILD" '
            $0 ~ "^## " ver "( |$)" {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "See CHANGELOG.md for $tag." > "$notes"
          fi
          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "Lunch Flow $tag" \
            --notes-file "$notes"

